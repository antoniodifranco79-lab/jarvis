<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Dinosauri 10 anni</title>
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; transform-origin: 50% 50%; }
  canvas { display: block; }
  #ui { position: absolute; inset: 0; pointer-events: none; font-family: "Inter Display", "Inter", "DejaVu Sans", sans-serif; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%); }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  .fade { position: absolute; inset: 0; background: #000; opacity: 0; }

  /* chip anno + barra progresso */
  .top { position: absolute; top: 150px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .chip { font-weight: 900; font-size: 54px; letter-spacing: 4px; color: #fff; background: rgba(0,0,0,0.55);
          padding: 14px 40px; border-radius: 60px; border: 4px solid #FFE14D; opacity: 0;
          text-shadow: 0 4px 12px rgba(0,0,0,.8); }
  .bar { display: flex; gap: 8px; opacity: 0; }
  .bar i { display: block; width: 72px; height: 16px; border-radius: 8px; background: rgba(255,255,255,0.25); }
  .bar i.on { background: #FFE14D; box-shadow: 0 0 18px rgba(255,225,77,.9); }

  /* titolo scena */
  .title { position: absolute; left: 60px; right: 60px; top: 300px; text-align: center; font-weight: 900; font-size: 150px; line-height: 0.95;
           color: #fff; text-transform: uppercase; letter-spacing: -2px; opacity: 0;
           -webkit-text-stroke: 3px #000; text-shadow: 0 10px 0 #000, 0 0 40px rgba(0,0,0,.9); white-space: pre-line; }
  .title.hook { top: 250px; font-size: 128px; color: #FFE14D; }
  .title.cta { top: 520px; font-size: 108px; }

  /* sottotitoli karaoke */
  .caps { position: absolute; left: 50px; right: 50px; top: 1180px; text-align: center; font-weight: 900; font-size: 84px; line-height: 1.12;
          color: #fff; text-transform: uppercase; -webkit-text-stroke: 2.5px #000;
          text-shadow: 0 8px 0 #000, 0 0 30px rgba(0,0,0,.9); }
  .caps span { display: inline-block; margin: 0 16px; transition: none; transform-origin: 50% 50%; }
  .caps span.on { color: #FFE14D; transform: scale(1.12); }

  /* chip informativo (fatto curioso) */
  .fact { position: absolute; left: 70px; right: 70px; top: 1520px; text-align: center; font-weight: 800; font-size: 50px; line-height: 1.2;
          color: #111; background: #FFE14D; padding: 24px 30px; border-radius: 28px; opacity: 0;
          box-shadow: 0 12px 0 #a88f1a, 0 20px 40px rgba(0,0,0,.6); }
  .fact b { color: #d4261c; }

  .cta2 { position: absolute; left: 40px; right: 40px; top: 1480px; text-align: center; font-weight: 900; font-size: 70px; color: #fff; opacity: 0;
          -webkit-text-stroke: 2px #000; text-shadow: 0 8px 0 #000; }
  .cta2 div { margin: 18px 0; }
  .cta2 .y { color: #FFE14D; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="ui">
    <div class="vignette"></div>
    <div class="top"><div class="chip" id="chip">ANNO 1</div><div class="bar" id="bar"></div></div>
    <div class="title" id="title"></div>
    <div class="caps" id="caps"></div>
    <div class="fact" id="fact"></div>
    <div class="cta2" id="cta2"><div>COMMENTA 👇 LA TUA STRATEGIA</div><div class="y">SEGUI ➜ PER IL PROSSIMO "E SE…"</div></div>
    <div class="flash" id="flash"></div>
    <div class="fade" id="fade"></div>
  </div>
</div>
<script type="module" src="./scene.js"></script>
</body>
</html>
