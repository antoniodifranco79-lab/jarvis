[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-ai"
version = "1.0.0"
description = "J.A.R.V.I.S. - Just A Rather Very Intelligent System. A faithful, voice-first personal AI built on Claude."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Antonio Di Franco" }]
keywords = ["jarvis", "assistant", "voice", "claude", "anthropic", "ai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "anthropic>=2.7.0",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "psutil>=5.9",
  "rich>=13.7",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "websockets>=12", "edge-tts>=6.1"]
voice = [
  "edge-tts>=6.1",
  "sounddevice>=0.4.6",
  "soundfile>=0.12",
  "numpy>=1.26",
  "faster-whisper>=1.0",
  "onnxruntime>=1.16",
  "openwakeword>=0.6; platform_system != 'Linux' or python_version < '3.12'",
]
vision = ["mss>=9.0", "pillow>=10.0", "opencv-python-headless>=4.9"]
local = ["ddgs>=9.0"]
app = ["pywebview>=5.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "httpx>=0.27"]
all = ["jarvis-ai[server,voice,vision,local,app,dev]"]

[project.scripts]
jarvis = "jarvis.cli:main"

[project.urls]
Homepage = "https://github.com/antoniodifranco79-lab/jarvis"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
"jarvis.server" = ["static/*"]
"jarvis.assets" = ["*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM105", "UP007"]
