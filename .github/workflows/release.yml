name: Release builds
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.0). Leave empty to only build artifacts."
        required: false
        default: ""
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev ffmpeg
      - run: python -m pip install -e ".[server,voice,local,app]" pyinstaller
      - run: python -m pip install --no-deps openwakeword
      - run: pyinstaller packaging/jarvis.spec --noconfirm --clean
      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "macOS" ]; then zip -qr ../JARVIS-macos.zip JARVIS.app
          elif [ "${{ runner.os }}" = "Windows" ]; then 7z a -r ../JARVIS-windows.zip JARVIS > /dev/null
          else tar -czf ../JARVIS-linux.tar.gz JARVIS; fi
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-${{ runner.os }}
          path: JARVIS-*
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: "J.A.R.V.I.S. ${{ github.event.inputs.tag || github.ref_name }}"
          files: packages/JARVIS-*
          body: |
            **J.A.R.V.I.S.** - Just A Rather Very Intelligent System. App desktop con voce, memoria, strumenti e HUD; cervello Claude (chiave API) oppure modello locale gratuito via Ollama.

            **Installazione / Install**
            - Serve [Ollama](https://ollama.com) per il modello locale (l'app lo avvia e scarica `qwen3:8b` da sola), oppure una chiave API Anthropic in `~/.jarvis/.env`.
            - **Windows**: scompatta `JARVIS-windows.zip` e avvia `JARVIS\JARVIS.exe`. Se SmartScreen avvisa: "Ulteriori informazioni" > "Esegui comunque".
            - **macOS**: scompatta `JARVIS-macos.zip`, trascina `JARVIS.app` in Applicazioni; al primo avvio clic destro > Apri (app non firmata), oppure `xattr -dr com.apple.quarantine /Applications/JARVIS.app`.
            - **Linux**: `tar -xzf JARVIS-linux.tar.gz && ./JARVIS/JARVIS`. Per la voce: `sudo apt install libportaudio2 ffmpeg`.
            - Configurazione (lingua, nome, voce, modello): file `~/.jarvis/.env`, vedi `.env.example` nel repository.

            Sorgenti e documentazione: README del repository.
