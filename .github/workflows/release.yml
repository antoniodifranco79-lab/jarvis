name: Release builds
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.0). Leave empty to only build artifacts."
        required: false
        default: ""
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev ffmpeg
      - run: python -m pip install -e ".[server,voice,local,app]" pyinstaller
      - run: python -m pip install --no-deps openwakeword
      - run: pyinstaller packaging/jarvis.spec --noconfirm --clean
      - name: Version
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:JARVIS_VERSION = "${{ steps.ver.outputs.version }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\jarvis.iss
      - name: macOS disk image
        if: runner.os == 'macOS'
        run: bash packaging/macos/build-dmg.sh "${{ steps.ver.outputs.version }}"
      - name: Debian package
        if: runner.os == 'Linux'
        run: bash packaging/linux/build-deb.sh "${{ steps.ver.outputs.version }}"
      - name: Portable archives
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "macOS" ]; then zip -qr ../JARVIS-macos-portable.zip JARVIS.app
          elif [ "${{ runner.os }}" = "Windows" ]; then 7z a -r ../JARVIS-windows-portable.zip JARVIS > /dev/null
          else tar -czf ../JARVIS-linux-portable.tar.gz JARVIS; fi
          mv JARVIS-Setup-*.exe JARVIS-*.dmg jarvis_*.deb .. 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-${{ runner.os }}
          path: |
            JARVIS-*
            jarvis_*.deb
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: "J.A.R.V.I.S. ${{ github.event.inputs.tag || github.ref_name }}"
          files: |
            packages/JARVIS-*
            packages/jarvis_*.deb
          body: |
            **J.A.R.V.I.S.** - Just A Rather Very Intelligent System. Scarica, installa, avvia: non serve altro.

            Al primo avvio l'app scarica da sola il motore AI e il modello linguistico (qualche GB, una volta sola) mostrando l'avanzamento nella finestra. Poi funziona offline, gratis, senza chiavi.

            **Windows**: `JARVIS-Setup-*-win64.exe`, installazione guidata con icona sul desktop. Se SmartScreen avvisa: "Ulteriori informazioni" > "Esegui comunque" (app non firmata).
            **macOS**: `JARVIS-*-macos.dmg`, trascina J.A.R.V.I.S. in Applicazioni. Al primo avvio clic destro > Apri.
            **Linux (Ubuntu/Debian)**: `jarvis_*_amd64.deb`, doppio clic > Installa. Compare nel menu applicazioni e sul desktop.

            Versioni portabili (senza installazione) negli archivi `*-portable.*`. Preferisci Claude al modello locale? Metti la chiave API in `~/.jarvis/.env`.
