<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<!-- HUD:HEAD:START -->
<title>JARVIS HUD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one dark holographic screen. Reactor on the left, transcript on the right, command line at the bottom; stacks on a phone. */
:root {
  --bg: #04080f;
  --bg-2: #081423;
  --fg: #d9edf9;
  --muted: #7693ab;
  --line: rgba(57, 198, 255, 0.18);
  --panel: rgba(10, 28, 46, 0.62);
  --accent: #39c6ff;
  --accent-soft: rgba(57, 198, 255, 0.14);
  --amber: #ffb547;
  --good: #52e39b;
  --bad: #ff6b7a;
  --font-display: "Orbitron", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(1200px 700px at 30% 40%, var(--bg-2), var(--bg) 70%);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto; gap: 12px; padding-block: 12px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; letter-spacing: 0.32em; margin: 0; color: var(--accent); text-shadow: 0 0 18px rgba(57,198,255,.45); }
.brand small { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); letter-spacing: 0.08em; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: var(--accent-soft); white-space: nowrap; }
.chip.state { color: var(--accent); border-color: rgba(57,198,255,.5); }
.chip.state[data-state="listening"] { color: var(--good); border-color: rgba(82,227,155,.5); background: rgba(82,227,155,.1); }
.chip.state[data-state="thinking"], .chip.state[data-state="transcribing"] { color: var(--accent); }
.chip.state[data-state="tool"], .chip.state[data-state="awaiting_approval"] { color: var(--amber); border-color: rgba(255,181,71,.5); background: rgba(255,181,71,.1); }
.chip.state[data-state="speaking"] { color: #fff; border-color: rgba(255,255,255,.4); }
.chip.demo { color: var(--amber); border-color: rgba(255,181,71,.5); background: rgba(255,181,71,.1); }
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 16px; min-height: 0; min-width: 0; }
main > * { min-width: 0; }
.reactor { position: relative; display: grid; place-items: center; min-height: 260px; min-width: 0; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); overflow: hidden; }
.reactor canvas { width: 100%; max-width: 520px; aspect-ratio: 1 / 1; height: auto; display: block; }
.reactor .caption { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.panel { display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.panel-head button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.panel-head button:hover, .panel-head button:focus-visible { background: var(--accent-soft); outline: none; border-color: var(--accent); }
.transcript { overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.turn { max-width: 92%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.turn.user { align-self: flex-end; background: rgba(57,198,255,.12); border: 1px solid rgba(57,198,255,.25); border-bottom-right-radius: 4px; }
.turn.jarvis { align-self: flex-start; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.turn.jarvis.streaming::after { content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite; }
.turn .who { display: block; font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.turn.system { align-self: center; font-family: var(--font-mono); font-size: 0.74rem; color: var(--muted); background: none; padding: 2px 8px; }
.turn.tool { align-self: flex-start; font-family: var(--font-mono); font-size: 0.74rem; color: var(--muted); background: none; padding: 0 8px; }
.turn.tool b { color: var(--amber); font-weight: 500; }
.turn.tool .ok { color: var(--good); } .turn.tool .err { color: var(--bad); }
.turn.reminder { align-self: stretch; background: rgba(255,181,71,.1); border: 1px solid rgba(255,181,71,.4); color: var(--amber); }
.approval { align-self: stretch; border: 1px solid rgba(255,181,71,.5); background: rgba(255,181,71,.08); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; }
.approval .title { font-family: var(--font-display); font-size: 0.78rem; letter-spacing: 0.2em; color: var(--amber); }
.approval pre { margin: 0; font-family: var(--font-mono); font-size: 0.78rem; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg); overflow-x: auto; }
.approval .actions { display: flex; gap: 8px; }
.approval button { font-family: var(--font-mono); font-size: 0.74rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 6px 14px; border-radius: 999px; cursor: pointer; border: 1px solid; background: transparent; }
.approval .allow { color: var(--good); border-color: var(--good); } .approval .deny { color: var(--bad); border-color: var(--bad); }
.approval button:hover, .approval button:focus-visible { background: rgba(255,255,255,.08); outline: none; }
footer form { display: flex; gap: 8px; align-items: center; }
footer input { flex: 1; min-width: 0; font: inherit; color: var(--fg); background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 999px; padding: 11px 18px; }
footer input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
footer input::placeholder { color: var(--muted); }
.btn { width: 46px; height: 46px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: var(--accent-soft); color: var(--accent); cursor: pointer; display: grid; place-items: center; }
.btn:hover, .btn:focus-visible { border-color: var(--accent); outline: none; box-shadow: 0 0 18px rgba(57,198,255,.35); }
.btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.btn.mic.on { color: #fff; background: var(--good); border-color: var(--good); box-shadow: 0 0 24px rgba(82,227,155,.5); }
.btn.wake.on { color: #04080f; background: var(--accent); }
.hint { font-family: var(--font-mono); font-size: 0.68rem; color: var(--muted); letter-spacing: 0.08em; text-align: center; margin-top: 6px; }
@keyframes blink { to { opacity: 0; } }
@media (max-width: 760px) {
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(220px, 1fr); }
  .reactor { min-height: 220px; }
  .reactor canvas { max-width: 300px; }
  .turn { max-width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .turn.jarvis.streaming::after { animation: none; } }
</style>
<!-- HUD:HEAD:END -->
</head>
<body>
<!-- HUD:BODY:START -->
<div class="app">
  <header>
    <div class="brand"><h1>J.A.R.V.I.S.</h1><small id="model">connecting…</small></div>
    <div class="chips">
      <span class="chip demo" id="demoChip" hidden>demo</span>
      <span class="chip" id="reminderChip" hidden>0 reminders</span>
      <span class="chip state" id="stateChip" data-state="idle">idle</span>
    </div>
  </header>
  <main>
    <section class="reactor" aria-label="Arc reactor status display">
      <canvas id="reactor" width="520" height="520"></canvas>
      <div class="caption" id="caption">all systems operational</div>
    </section>
    <section class="panel" aria-label="Conversation">
      <div class="panel-head"><span>transcript</span><button type="button" id="newSession" title="Start a fresh conversation">new session</button></div>
      <div class="transcript" id="transcript"></div>
    </section>
  </main>
  <footer>
    <form id="form" autocomplete="off">
      <button type="button" class="btn wake" id="wakeBtn" title="Always listen for the word 'Jarvis'" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M3 12h2m14 0h2M12 3v2m0 14v2"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>
      </button>
      <input id="input" placeholder="Say something to Jarvis…" aria-label="Message">
      <button type="button" class="btn mic" id="micBtn" title="Hold to talk (or click to toggle)" aria-pressed="false">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button type="submit" class="btn" id="sendBtn" title="Send">
        <svg viewBox="0 0 24 24"><path d="M4 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <div class="hint" id="hint">type, or hold the microphone · say "Jarvis, …" in wake mode</div>
  </footer>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const transcript = $("transcript"), input = $("input"), stateChip = $("stateChip"), caption = $("caption");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const app = { state: "idle", demo: false, ws: null, level: 0, userName: "Sir", lang: navigator.language.startsWith("it") ? "it-IT" : "en-GB", streaming: null, audioQueue: [], playing: false, wake: false, recognizing: false };

  // ---------------------------------------------------------------- transcript
  const addTurn = (cls, html, who) => {
    const el = document.createElement("div");
    el.className = "turn " + cls;
    if (who) { const w = document.createElement("span"); w.className = "who"; w.textContent = who; el.appendChild(w); }
    const body = document.createElement("span"); body.className = "body"; body.textContent = html; el.appendChild(body);
    transcript.appendChild(el); transcript.scrollTop = transcript.scrollHeight; return el;
  };
  const addTool = (name, ok, preview) => {
    const el = document.createElement("div"); el.className = "turn tool";
    el.innerHTML = `⚙ <b></b> <span class="${ok ? "ok" : "err"}">${ok ? "✓" : "✗"}</span> <span class="p"></span>`;
    el.querySelector("b").textContent = name; el.querySelector(".p").textContent = preview || "";
    transcript.appendChild(el); transcript.scrollTop = transcript.scrollHeight;
  };
  const streamText = (text) => {
    if (!app.streaming) app.streaming = addTurn("jarvis streaming", "", "jarvis");
    app.streaming.querySelector(".body").textContent += text; transcript.scrollTop = transcript.scrollHeight;
  };
  const endStream = () => { if (app.streaming) { app.streaming.classList.remove("streaming"); if (!app.streaming.querySelector(".body").textContent) app.streaming.remove(); } app.streaming = null; };
  const showApproval = (id, tool, args) => {
    const el = document.createElement("div"); el.className = "approval";
    el.innerHTML = `<div class="title">approval required · ${tool}</div><pre></pre><div class="actions"><button class="allow" type="button">allow</button><button class="deny" type="button">deny</button></div>`;
    el.querySelector("pre").textContent = JSON.stringify(args, null, 2);
    const answer = (allowed) => { send({ type: "approval", id, allowed }); el.querySelector(".actions").innerHTML = `<span class="who">${allowed ? "allowed" : "denied"}</span>`; };
    el.querySelector(".allow").onclick = () => answer(true); el.querySelector(".deny").onclick = () => answer(false);
    transcript.appendChild(el); transcript.scrollTop = transcript.scrollHeight;
  };
  const setState = (s, tool) => {
    app.state = s; stateChip.dataset.state = s; stateChip.textContent = s === "awaiting_approval" ? "approval" : (s === "tool" && tool ? tool : s);
    caption.textContent = { idle: "all systems operational", listening: "listening", transcribing: "transcribing", thinking: "processing", tool: tool ? "running " + tool : "working", speaking: "speaking", awaiting_approval: "awaiting your approval" }[s] || s;
  };

  // ---------------------------------------------------------------- audio out
  const synth = window.speechSynthesis;
  const pickVoice = (lang) => { const vs = synth ? synth.getVoices() : []; return vs.find(v => v.lang.replace("_","-").toLowerCase() === lang.toLowerCase() && /ryan|daniel|george|diego|male/i.test(v.name)) || vs.find(v => v.lang.replace("_","-").toLowerCase().startsWith(lang.slice(0,2))) || null; };
  const guessLang = (t) => /\b(il|la|di|che|sono|signore|buongiorno|buonasera|grazie|oggi|non)\b/i.test(t) ? "it-IT" : "en-GB";
  const speakFallback = (text) => new Promise((resolve) => {
    if (!synth) return resolve();
    const u = new SpeechSynthesisUtterance(text); const lang = guessLang(text); u.lang = lang; const v = pickVoice(lang); if (v) u.voice = v; u.rate = 1.02; u.pitch = 0.9;
    u.onend = resolve; u.onerror = resolve; synth.speak(u);
  });
  const playNext = async () => {
    if (app.playing) return; const item = app.audioQueue.shift(); if (!item) { if (app.state === "speaking") setState("idle"); return; }
    app.playing = true; setState("speaking");
    try {
      if (item.b64) await new Promise((res) => { const a = new Audio("data:" + item.mime + ";base64," + item.b64); a.onended = res; a.onerror = res; a.play().catch(res); });
      else await speakFallback(item.text);
    } finally { app.playing = false; playNext(); }
  };
  const enqueueAudio = (item) => { app.audioQueue.push(item); playNext(); };

  // ---------------------------------------------------------------- reactor
  const canvas = $("reactor"), ctx = canvas.getContext("2d");
  let t0 = performance.now(), bars = new Array(48).fill(0);
  const draw = (now) => {
    const t = (now - t0) / 1000, W = canvas.width, H = canvas.height, cx = W / 2, cy = H / 2, R = W * 0.42;
    const s = app.state, speed = reduced ? 0 : (s === "thinking" || s === "transcribing" ? 1.6 : s === "tool" ? 1.0 : s === "speaking" ? 0.7 : 0.25);
    const col = s === "listening" ? "82,227,155" : (s === "tool" || s === "awaiting_approval") ? "255,181,71" : "57,198,255";
    ctx.clearRect(0, 0, W, H);
    const pulse = reduced ? 0.5 : 0.5 + 0.5 * Math.sin(t * (s === "idle" ? 1.2 : 3));
    const glow = ctx.createRadialGradient(cx, cy, R * 0.05, cx, cy, R * 0.55);
    glow.addColorStop(0, `rgba(${col},${0.55 + 0.25 * pulse})`); glow.addColorStop(0.5, `rgba(${col},0.12)`); glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, R * 0.55, 0, Math.PI * 2); ctx.fill();
    // tick ring
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * speed * 0.1);
    for (let i = 0; i < 90; i++) { const a = (i / 90) * Math.PI * 2, big = i % 15 === 0; ctx.strokeStyle = `rgba(${col},${big ? 0.9 : 0.35})`; ctx.lineWidth = big ? 2.2 : 1; ctx.beginPath(); ctx.moveTo(Math.cos(a) * R, Math.sin(a) * R); ctx.lineTo(Math.cos(a) * (R - (big ? 14 : 7)), Math.sin(a) * (R - (big ? 14 : 7))); ctx.stroke(); }
    ctx.restore();
    // rotating arcs
    [[0.9, 0.9, 1], [0.78, -1.3, 0.6], [0.66, 0.6, 0.45]].forEach(([r, dir, len], i) => {
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * speed * dir + i);
      ctx.strokeStyle = `rgba(${col},${0.55 + 0.15 * i})`; ctx.lineWidth = i === 0 ? 3 : 2; ctx.lineCap = "round";
      for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(0, 0, R * r, k * 2.1, k * 2.1 + len); ctx.stroke(); }
      ctx.restore();
    });
    // spectrum bars (speaking / listening)
    const active = s === "speaking" || s === "listening";
    for (let i = 0; i < bars.length; i++) { const target = active ? (s === "listening" ? app.level : 0.25 + Math.random() * 0.75) * (0.4 + 0.6 * Math.abs(Math.sin(i * 1.7 + t * 5))) : 0.05; bars[i] += (target - bars[i]) * (reduced ? 1 : 0.25); }
    ctx.save(); ctx.translate(cx, cy);
    for (let i = 0; i < bars.length; i++) { const a = (i / bars.length) * Math.PI * 2, r0 = R * 0.36, h = 6 + bars[i] * R * 0.16; ctx.strokeStyle = `rgba(${col},0.8)`; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); ctx.lineTo(Math.cos(a) * (r0 + h), Math.sin(a) * (r0 + h)); ctx.stroke(); }
    ctx.restore();
    // scanner sweep when thinking
    if (s === "thinking" || s === "transcribing" || s === "tool") { ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * 4); const g = ctx.createLinearGradient(0, 0, R * 0.6, 0); g.addColorStop(0, `rgba(${col},0.0)`); g.addColorStop(1, `rgba(${col},0.7)`); ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(R * 0.6, 0); ctx.stroke(); ctx.restore(); }
    // core
    ctx.fillStyle = `rgba(${col},${0.75 + 0.25 * pulse})`; ctx.shadowColor = `rgba(${col},0.9)`; ctx.shadowBlur = 30 + 20 * pulse; ctx.beginPath(); ctx.arc(cx, cy, R * 0.16, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.beginPath(); ctx.arc(cx, cy, R * 0.06, 0, Math.PI * 2); ctx.fill();
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);

  // ---------------------------------------------------------------- transport
  const send = (obj) => { if (app.ws && app.ws.readyState === 1) app.ws.send(JSON.stringify(obj)); else if (app.demo) demoHandle(obj); };
  const handle = (m) => {
    switch (m.type) {
      case "hello": $("model").textContent = m.model; app.userName = m.user_name; setState(m.state);
        (m.transcript || []).forEach(t => addTurn(t.role === "user" ? "user" : "jarvis", t.text, t.role === "user" ? "you" : "jarvis"));
        updateReminders(m.reminders || []); addTurn("jarvis", m.greeting, "jarvis"); break;
      case "state": setState(m.state, m.tool); break;
      case "user": addTurn("user", m.text, "you"); break;
      case "text": streamText(m.text); break;
      case "final": endStream(); break;
      case "tool_end": addTool(m.name, m.ok, m.preview); break;
      case "audio": enqueueAudio({ b64: m.b64, mime: m.mime }); break;
      case "speak": enqueueAudio({ text: m.text }); break;
      case "approval_request": showApproval(m.id, m.tool, m.input); break;
      case "reminder": addTurn("reminder", "⏰ " + m.message); fetch("/api/reminders").then(r => r.json()).then(updateReminders).catch(() => {}); break;
      case "notice": case "error": endStream(); addTurn("system", m.message); if (app.state === "idle") caption.textContent = m.message.toLowerCase().slice(0, 60); break;
      case "session": if (m.new && transcript.querySelector(".turn.user")) addTurn("system", "— new session —"); break;
    }
  };
  const updateReminders = (list) => { const c = $("reminderChip"); c.hidden = !list.length; c.textContent = list.length + (list.length === 1 ? " reminder" : " reminders"); };
  const connect = () => {
    let ws; try { ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws"); } catch (e) { return enterDemo(); }
    const timer = setTimeout(() => { if (ws.readyState !== 1) { ws.close(); enterDemo(); } }, 2500);
    ws.onopen = () => { clearTimeout(timer); app.ws = ws; app.demo = false; $("demoChip").hidden = true; };
    ws.onmessage = (ev) => { try { handle(JSON.parse(ev.data)); } catch (e) { console.error(e); } };
    ws.onclose = () => { clearTimeout(timer); if (app.ws === ws) { app.ws = null; addTurn("system", "connection lost · retrying"); setTimeout(connect, 2000); } else if (!app.demo) enterDemo(); };
    ws.onerror = () => {};
  };

  // ---------------------------------------------------------------- demo mode (no backend: the artifact preview)
  const enterDemo = () => {
    if (app.demo) return; app.demo = true; $("demoChip").hidden = false; $("model").textContent = "demo · no backend";
    handle({ type: "hello", model: "demo · no backend", user_name: "Sir", state: "idle", transcript: [], reminders: [], greeting: "Good evening, Sir. This is a preview of the interface: no backend is connected, so I'll improvise. Try asking for the time, the weather, or a systems check." });
  };
  const demoReply = (text) => {
    const t = text.toLowerCase(), it = /[àèéìòù]|\b(che|ora|ore|come|sono|tempo|meteo|sistemi|grazie|ciao)\b/.test(t);
    const now = new Date(), hh = now.getHours(), mm = String(now.getMinutes()).padStart(2, "0");
    if (/time|ora\b|ore\b/.test(t)) return { tool: ["get_datetime", true, now.toISOString()], text: it ? `Sono le ${hh} e ${mm}, Signore.` : `It's ${hh}:${mm}, Sir.` };
    if (/weather|meteo|tempo|rain|piov/.test(t)) return { tool: ["get_weather", true, "Milano · 14°C · partly cloudy"], text: it ? "A Milano ci sono quattordici gradi e qualche nuvola. L'ombrello può restare a casa." : "Fourteen degrees and partly cloudy in Milan. The umbrella can stay at home, Sir." };
    if (/status|diagnos|system|sistem|battery|batteria/.test(t)) return { tool: ["system_status", true, "cpu 12% · memory 41% · disk 63%"], text: it ? "Tutti i sistemi operativi: processore al dodici per cento, memoria al quarantuno. Niente di cui preoccuparsi." : "All systems operational: processor at twelve percent, memory at forty-one. Nothing to worry about." };
    if (/remind|timer|ricord/.test(t)) return { tool: ["set_reminder", true, "Reminder #1 set"], text: it ? "Fatto. Glielo ricorderò io, Signore." : "Done. I'll remind you, Sir." };
    if (/who are you|chi sei|what are you/.test(t)) return { text: it ? "Just A Rather Very Intelligent System, Signore. Il suo maggiordomo digitale, al suo servizio." : "Just A Rather Very Intelligent System, Sir. Your digital butler, at your service." };
    if (/thank|grazie/.test(t)) return { text: it ? "È un piacere, Signore." : "Always a pleasure, Sir." };
    return { text: it ? "In questa anteprima posso solo improvvisare, Signore. Avviata con il backend, risponderei davvero, con ricerca web, memoria e strumenti." : "In this preview I can only improvise, Sir. Running with the backend, I'd answer properly, with web search, memory and tools." };
  };
  const demoHandle = async (obj) => {
    if (obj.type === "new_session") return handle({ type: "session", new: true });
    if (obj.type !== "ask") return;
    handle({ type: "user", text: obj.text }); setState("thinking"); await new Promise(r => setTimeout(r, 700));
    const reply = demoReply(obj.text);
    if (reply.tool) { setState("tool", reply.tool[0]); await new Promise(r => setTimeout(r, 600)); handle({ type: "tool_end", name: reply.tool[0], ok: reply.tool[1], preview: reply.tool[2] }); setState("thinking"); }
    for (const ch of reply.text.split(/(?<=\s)/)) { handle({ type: "text", text: ch }); await new Promise(r => setTimeout(r, 28)); }
    handle({ type: "final", text: reply.text }); handle({ type: "speak", text: reply.text }); if (!app.playing) setState("idle");
  };

  // ---------------------------------------------------------------- input: text, microphone, wake mode
  const ask = (text) => { text = (text || "").trim(); if (!text) return; endStream(); send({ type: "ask", text }); input.value = ""; };
  $("form").addEventListener("submit", (e) => { e.preventDefault(); ask(input.value); });
  $("newSession").onclick = () => send({ type: "new_session" });
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null;
  const startRec = (continuous) => {
    if (!SR) { addTurn("system", "speech recognition isn't available in this browser · use Chrome, or run `jarvis voice`"); return; }
    if (rec) rec.stop();
    rec = new SR(); rec.lang = app.lang; rec.continuous = continuous; rec.interimResults = true;
    rec.onstart = () => { app.recognizing = true; $("micBtn").classList.toggle("on", !continuous); $("micBtn").setAttribute("aria-pressed", String(!continuous)); if (!continuous) setState("listening"); };
    rec.onresult = (ev) => {
      let final = "", interim = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) { const r = ev.results[i]; if (r.isFinal) final += r[0].transcript; else interim += r[0].transcript; }
      app.level = Math.min(1, 0.3 + interim.length / 40);
      if (continuous) { const m = /\bjarvis\b[,.!?]?\s*(.+)/i.exec(final); if (m && m[1].trim()) ask(m[1]); }
      else { input.value = final || interim; if (final) ask(final); }
    };
    rec.onerror = (e) => { if (e.error !== "no-speech" && e.error !== "aborted") addTurn("system", "microphone: " + e.error); };
    rec.onend = () => { app.recognizing = false; $("micBtn").classList.remove("on"); $("micBtn").setAttribute("aria-pressed", "false"); if (app.state === "listening") setState("idle"); if (app.wake && continuous) setTimeout(() => startRec(true), 300); };
    try { rec.start(); } catch (e) { addTurn("system", "microphone: " + e.message); }
  };
  const stopRec = () => { if (rec) { const r = rec; rec = null; r.onend = null; r.stop(); app.recognizing = false; $("micBtn").classList.remove("on"); if (app.state === "listening") setState("idle"); } };
  const mic = $("micBtn"); let holdTimer = null, held = false;
  mic.addEventListener("pointerdown", () => { held = false; holdTimer = setTimeout(() => { held = true; startRec(false); }, 250); });
  mic.addEventListener("pointerup", () => { clearTimeout(holdTimer); if (held) { held = false; setTimeout(stopRec, 400); } else if (app.recognizing && !app.wake) stopRec(); else { app.wake = false; $("wakeBtn").classList.remove("on"); startRec(false); } });
  mic.addEventListener("pointerleave", () => { clearTimeout(holdTimer); });
  $("wakeBtn").onclick = () => { app.wake = !app.wake; $("wakeBtn").classList.toggle("on", app.wake); $("wakeBtn").setAttribute("aria-pressed", String(app.wake)); if (app.wake) { addTurn("system", "wake mode on · say \"Jarvis, …\""); startRec(true); } else stopRec(); };
  input.addEventListener("keydown", (e) => { if (e.key === "Escape") input.value = ""; });
  if (synth) synth.onvoiceschanged = () => {};
  connect();
})();
</script>
